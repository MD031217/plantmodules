<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        :root {
            --page-bg: #EEF0F4;
            --card-bg:  #0FB881;
            --brand-color:  #0FB881;
            --text-white: #111111;
            --text-on-green: #ffffff;
            --input-bg: #ffffff;
            --input-text: #333333;
            --btn-bg: #ffffff;
            --btn-text: #0FB881;
            --shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
            --placeholder-color: #6CD3B2;
        }

        .theme-light {
            --page-bg: #0F182B;
            --card-bg: #21C85F;
            --brand-color: #21C85F;
            --text-white: #ffffff;
            --text-on-green: #ffffff;
            --input-bg: #ffffff;
            --input-text: #333333;
            --btn-bg: #ffffff;
            --btn-text: #21C85F;
            --shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
            --placeholder-color: #77DD9D;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--page-bg);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.4s ease;
        }

        .falling-leaf {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 1;
            animation: fallingLeaf var(--fall-duration, 3s) linear forwards;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.1));
        }

        @keyframes fallingLeaf {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 1;
            }
            25% {
                transform: translateY(25vh) translateX(var(--sway, 30px)) rotate(var(--rotation, 20deg));
            }
            50% {
                transform: translateY(50vh) translateX(calc(var(--sway, 30px) * -0.5)) rotate(calc(var(--rotation, 20deg) * -0.5));
                opacity: 0.9;
            }
            75% {
                transform: translateY(75vh) translateX(var(--sway, 30px)) rotate(var(--rotation, 20deg));
            }
            100% {
                transform: translateY(110vh) translateX(0) rotate(calc(var(--rotation, 20deg) * 1.5));
                opacity: 0;
            }
        }

        .theme-switcher {
            position: absolute;
            top: 32px;
            right: 32px;
            cursor: pointer;
            width: 60px;
            height: 60px;
            background-color: #F1F3F6;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.3s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .theme-switcher:hover {
            transform: scale(1.05);
        }

        .theme-switcher .theme-icon-img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: invert(0);
        }

        body.theme-light .theme-switcher {
            background-color: #1B263B;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        body.theme-light .theme-switcher .theme-icon-img {
            filter: invert(1);
        }

        .wrapper {
            width: 100%;
            padding: 20px;
            text-align: center;
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            width: 500px;
            max-width: 100%;
            height: auto;
            margin-bottom: 0px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .logo-light {
            display: block;
        }

        .logo-dark {
            display: none;
        }

        body.theme-light .logo-light {
            display: none;
        }

        body.theme-light .logo-dark {
            display: block;
        }

        .auth-card {
            width: 16.67cm;
            height: 9.86cm;
            background-color: var(--card-bg);
            border-radius: 65px;
            padding: 28px 32px 32px;
            box-shadow: var(--shadow);
            transition: background-color 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 0 auto;
        }

        .auth-card h1 {
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-on-green);
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 14px;
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 500;
            background: var(--input-bg);
            color: var(--input-text);
            transition: box-shadow 0.2s;
        }

        .form-group input::placeholder {
            color: var(--placeholder-color);
            opacity: 1;
            font-weight: 400;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            cursor: pointer;
            opacity: 0.85;
            transition: opacity 0.2s;
        }
        .toggle-password:hover { opacity: 1; }

        .register-link {
            margin-bottom: 18px;
            font-size: 16px;
            color: var(--text-on-green);
            opacity: 0.95;
        }

        .register-link a {
            color: var(--text-on-green);
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .btn {
            width: 60%;
            padding: 14px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 12px;
            font-size: 19px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
        }

        .btn:active { transform: scale(0.98); }

        @media (max-width: 480px) {
            .auth-card {
                width: 92%;
                height: auto;
                padding: 24px 20px;
            }
            .brand-logo { width: 85%; }
        }
    </style>
</head>
<body class="theme-dark">
    <div class="theme-switcher" id="themeSwitcher">
        <img src="тема.png" alt="Переключить тему" class="theme-icon-img">
    </div>
    <div class="wrapper">
        <img src="Тёмная.png" alt="Зеленая полка" class="brand-logo logo-light">
        <img src="Светлая.png" alt="Зеленая полка" class="brand-logo logo-dark">
        <div class="auth-card">
            <h1>Авторизация</h1>
            <form id="loginForm"> 
                <form action="#" method="POST" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <input type="text" id="loginInput" name="login" placeholder="Логин" required autocomplete="username">
                    </div>
                    
                    <div class="form-group">
                        <input type="password" id="passwordInput" name="password" placeholder="Пароль" required autocomplete="current-password">
                        <img src="Открытый.png" alt="Показать пароль" class="toggle-password" id="togglePassword">
                    </div>

                    <div class="register-link">
                        Нет аккаунта? <a href="register.html">Зарегистрируйся!</a>
                    </div>

                    <button type="submit" class="btn">Вход</button>
                </form>
            </form>
        </div>
    </div>

    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.body.classList.remove('theme-dark', 'theme-light');
            document.body.classList.add(savedTheme);
        }

        document.getElementById('themeSwitcher').addEventListener('click', function() {
            const isDark = document.body.classList.contains('theme-dark');
            document.body.classList.remove('theme-dark', 'theme-light');
            document.body.classList.add(isDark ? 'theme-light' : 'theme-dark');
            localStorage.setItem('theme', isDark ? 'theme-light' : 'theme-dark');
        });

        const passwordInput = document.getElementById('passwordInput');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', function() {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            this.src = isPassword ? 'Закрытый.png' : 'Открытый.png';
            this.alt = isPassword ? 'Скрыть пароль' : 'Показать пароль';
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.auth-card') && !e.target.closest('.theme-switcher')) {
                e.preventDefault(); 
                createFallingLeaves(e.clientX, e.clientY);
            }
        });

        function createFallingLeaves(x, y) {
            const leafSrc = 'листок.png'; 
            
            const count = 8 + Math.floor(Math.random() * 5); 

            for (let i = 0; i < count; i++) {
                const leaf = document.createElement('img');
                leaf.src = leafSrc;
                leaf.className = 'falling-leaf';
                leaf.onerror = function() {
                    this.style.border = '1px solid red';
                    this.style.width = '20px';
                    this.style.height = '20px';
                    console.error("Ошибка загрузки картинки falling-leaf.png!");
                };
                const size = 15 + Math.random() * 20;
                leaf.style.width = size + 'px';
                leaf.style.height = 'auto';
                const offsetX = (Math.random() - 0.5) * 40;
                const offsetY = (Math.random() - 0.5) * 20;
                leaf.style.left = (x + offsetX) + 'px';
                leaf.style.top = (y + offsetY) + 'px';
                const rotation = (Math.random() - 0.5) * 60;
                const swayAmount = 20 + Math.random() * 40;
                leaf.style.setProperty('--sway', swayAmount + 'px');
                leaf.style.setProperty('--rotation', rotation + 'deg');
                leaf.style.setProperty('--fall-duration', (2 + Math.random() * 2) + 's');       
                document.body.appendChild(leaf);
                leaf.addEventListener('animationend', function() {
                    leaf.remove();
                });
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (document.getElementById('loginInput').value.trim() === 'admin' && 
                document.getElementById('passwordInput').value.trim() === 'admin') {
                window.location.href = 'profile.html';
            } else {
                alert('Неверный логин или пароль');
            }
        });
    </script>
</body>
</html>
